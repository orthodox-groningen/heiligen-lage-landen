# Parochiespecifieke lezingen — Orthodox klooster van de Heilige Joannes
# de Voorloper, Den Haag.
# Id: den-haag (bestand = parochies/den-haag.yaml; zie config.yaml).

parochie: den-haag
naam: "Orthodox klooster van de Heilige Joannes de Voorloper, Den Haag"
overrides:
