namen:
  primair: Maandag van de Heilige Geest
  alternatief:
  - Maandag van de Geest
  - Dag van de Heilige Geest
  - Pinkstermaandag
observances:
  - feest
datum:
  stijl: gregoriaans
  paascyclus:
    anker: pascha
    offset_dagen: 50
samenvatting: |
  Tweede dag van Pinksteren; eer aan de Heilige Geest.
verhaal: |
  De dag na Pinksteren is bijzonder gewijd aan de Heilige Geest.
betekenis: |
  Pinksteren duurt: Vader, Zoon en Geest, één God. Deze maandag eert
  de Geest die gisteren op de apostelen daalde en in de gedoopten
  blijft. De knielgebeden waren aan de vespers van het feest; nu is
  de vreugde van de lichte week van de Geest.

  Het Apostolisch vasten begint niet op deze dag, maar na
  Allerheiligen-zondag, tot Petrus en Paulus.
