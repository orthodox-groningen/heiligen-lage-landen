lage_landen: false
namen:
  primair: Zondag van het Laatste Oordeel (Vleesvaarwel)
  alternatief:
  - Vleesvaarwelzondag
  - Zondag van het Laatste Oordeel
  - Vleesvaarwel
  - Meatfare
observances:
  - feest
datum:
  stijl: gregoriaans
  paascyclus:
    anker: pascha
    offset_dagen: -56
samenvatting: |
  Laatste dag met vlees; evangelie van het Laatste Oordeel.
verhaal: |
  Christus spreekt over het oordeel: schapen en bokken (Matt. 25).
betekenis: |
  Hij scheidt niet op vrome woorden, maar op wat we de hongerige, de
  vreemdeling, de zieke deden. «Wat gij aan de minste hebt gedaan, hebt
  gij aan Mij gedaan.»

  Vandaag is de laatste dag met vlees in veel kerken. De tafel wijkt al;
  de naaste wijkt niet. Wie vast zonder barmhartigheid, mist het oordeel.
