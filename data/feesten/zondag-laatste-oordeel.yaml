samenvatting: |
  Laatste dag met vlees; evangelie van het Laatste Oordeel.
verhaal: |
  Vleesmijdingszondag is de laatste dag waarop traditioneel vlees wordt gegeten vóór de vasten. Het evangelie van het Laatste Oordeel (Mt. 25) herinnert eraan dat liefde tot de naaste meetelt voor Gods oordeel. Daarna volgt de Boterweek.
