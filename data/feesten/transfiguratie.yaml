samenvatting: |
  Christus toont Zijn goddelijke heerlijkheid aan Petrus, Jakobus en Johannes.
verhaal: |
  Op de berg Thabor wordt de heerlijkheid van Christus geopenbaard; Mozes en Elia verschijnen met Hem.
betekenis: |
  De leerlingen zien wie Hij is vóór het kruis, zodat zij later
  begrijpen: Hij lijdt niet omdat Hij moet, maar omdat Hij het wil.
  Mozes en Elia staan erbij: wet en profeten komen tot hun doel in
  Hem. De heerlijkheid in Zijn gelaat is de heerlijkheid van God zelf.

  Dit feest toont ook onze bestemming. Niet alleen Christus, maar de
  mens en de schepping zijn bedoeld om in dat licht te delen. De
  wijding van vruchten op deze dag wijst daarheen: alles mag tot
  bloei komen in Gods rijk.
