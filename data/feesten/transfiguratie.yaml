samenvatting: |
  Christus toont Zijn goddelijke heerlijkheid aan Petrus, Jakobus en Johannes.
verhaal: |
  Op de berg Thabor wordt de heerlijkheid van Christus geopenbaard; Mozes en Elia verschijnen met Hem.
betekenis: |
  De leerlingen zien wie Hij is vóór het kruis, zodat zij later
  begrijpen: Hij lijdt niet omdat Hij moet, maar omdat Hij het wil.
  Mozes en Elia staan erbij. Het licht in Zijn gelaat is Gods eigen
  heerlijkheid — bestemming ook van de mens, niet van Christus alleen.

  De Kerk wijdt op deze dag vruchten: de schepping mag tot bloei komen
  in Gods rijk. In het Ontslapenvasten is dit de dag waarop vis aan
  tafel hoort.
