samenvatting: |
  Christus in het graf; vooravond van Pascha.
verhaal: |
  Christus rust in het graf; de Kerk gedenkt zijn nederdaling ter helle.
betekenis: |
  Het lichaam ligt in het graf, de ziel daalt af naar het dodenrijk.
  Daar verbreekt Hij de poorten: de dood houdt Hem niet, en houdt ons
  niet meer vast als slaven. Dit is de sabbat waarop God rust — en de
  hel leeghaalt.

  De liturgie draait al naar licht: doop, wissel van gewaden, «sta op
  God». Nog niet de nachtkreet van Pascha, wel de zekerheid dat de
  Opstanding al onderweg is. Blijf bij het graf tot de nacht.
