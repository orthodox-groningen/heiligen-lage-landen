id: grote-zaterdag
soort: feest
bronlaag: nagekeken
cyclus: paascyclus
lage_landen: false
namen:
  primair: Grote Zaterdag
  alternatief:
  - Heilige en Grote Zaterdag
observances:
  - feest
  - vasten
datum:
  stijl: gregoriaans
  paascyclus:
    anker: pascha
    offset_dagen: -1
samenvatting: |
  Christus in het graf; vooravond van Pascha.
verhaal: |
  Grote Zaterdag viert Christus’ rust in het graf en zijn nederdaling ter helle. De liturgie draait al naar het licht van Pascha: de dood is verslagen, al is de Opstanding nog niet gevierd.
