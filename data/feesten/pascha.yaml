samenvatting: |
  Feest van de Opstanding; middelpunt van het kerkelijk jaar.
verhaal: |
  Pascha is het feest van feesten: Christus is opgestaan uit de doden. Alle Orthodoxe kerken vieren Pascha op dezelfde datum, berekend volgens de Alexandrijnse/Juliaanse computus (wereldlijk vaak op een andere zondag dan westers Pasen).   Vanaf hier telt de lichte week en de weg naar Pinksteren.
betekenis: |
  Pascha is geen naspel van een oude ochtend. Het is de doortocht:
  van dood naar leven, van aarde naar hemel. Christus is opgestaan
  en vertreedt de dood door de dood. Wie tot Hem behoort, wordt
  meegevoerd naar het leven.

  De nachtviering is de nieuwe schepping: licht waar duisternis was.
  Aan de tafel van het Lam deelt de Kerk in Zijn overwinning. «Christus
  is opgestaan» is geen herinnering alleen, maar de uitnodiging om
  zelf op te staan en tot Hem te komen.
