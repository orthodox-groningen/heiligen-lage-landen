verhaal: |
  Pascha is het feest van feesten: Christus is opgestaan uit de doden. Alle Orthodoxe kerken vieren Pascha op dezelfde datum, berekend volgens de Alexandrijnse/Juliaanse computus (wereldlijk vaak op een andere zondag dan westers Pasen). Vanaf hier telt de lichte week en de weg naar Pinksteren.
