samenvatting: |
  Feestdag van de eerste apostelen Petrus en Paulus.
verhaal: |
  De Kerk eert Petrus en Paulus als apostelen en martelaren op één dag.
betekenis: |
  Twee wegen, één Kerk: Petrus de rots van de belijdenis, Paulus de
  verkondiger tot de volken. Geen van beiden is het hoofd in plaats van
  Christus; beiden geven hun bloed.

  Dit feest sluit het Apostolisch vasten. Wie tot hier heeft gewaakt,
  komt tot de tafel van de apostelen: één geloof, twee getuigen, dezelfde
  Heer.
