id: zondag-kruisverering
soort: feest
bronlaag: nagekeken
cyclus: paascyclus
lage_landen: false
namen:
  primair: Derde zondag van de Vasten (Kruisverering)
  alternatief:
  - Derde zondag van de Vasten
  - Kruisverering
  - Zondag van de Kruisverering
observances:
  - feest
  - vasten
datum:
  stijl: gregoriaans
  paascyclus:
    anker: pascha
    offset_dagen: -28
samenvatting: |
  Midden in de vasten: verering van het Heilig Kruis.
verhaal: |
  Halverwege de Vasten wordt het Kruis ter verering midden in de kerk
  gezet.
betekenis: |
  Wie moe wordt van de veertig dagen, krijgt het Kruis te zien: niet
  als einde, maar als staf. Christus ging die weg vooruit. «Wie Mij
  volgen wil, neme zijn kruis op.»

  Buig en kus. De vasten is geen sport; het is meegaan tot Golgotha en
  Pascha. Zonder het Kruis is onthouding ijdel.
referenties:
