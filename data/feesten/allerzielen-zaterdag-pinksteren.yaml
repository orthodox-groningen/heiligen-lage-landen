    geraadpleegd: "2026-08-21"
    inhoud: "1 Korintiërs 15: opstanding van de doden; dezelfde hoop vóór de gave van de Geest."
  - label: "Basilius — Over de Heilige Geest"
    url: "https://www.newadvent.org/fathers/3203.htm"
    geraadpleegd: "2026-08-21"
    inhoud: "De Geest die levend maakt, vereerd met de Vader en de Zoon."
