id: allerzielen-zaterdag-pinksteren
soort: feest
bronlaag: nagekeken
cyclus: paascyclus
lage_landen: false
namen:
  primair: Allerzielen-zaterdag (vóór Pinksteren)
  alternatief:
  - Allerzielen-zaterdag
  - Zaterdag van de zielen (vóór Pinksteren)
observances:
  - feest
datum:
  stijl: gregoriaans
  paascyclus:
    anker: pascha
    offset_dagen: 48
samenvatting: |
  Gedachtenis van de overledenen vóór Pinksteren.
verhaal: |
  Aan de vooravond van Pinksteren gedenkt de Kerk opnieuw de ontslapenen.
betekenis: |
  De Geest die morgen komt, is dezelfde Geest die de doden zal opwekken.
  Levenden en ontslapenen horen bij één lichaam. Pinksteren is geen feest
  van alleen wie nog ademt.

  Bid voor hen vóór de knielgebeden van de vespers. De gemeenschap die de
  Geest verzegelt, reikt over het graf.
referenties:
