samenvatting: |
  Maria wordt als kind in de tempel gebracht.
verhaal: |
  De traditie viert dat Maria als kind aan God wordt toegewijd in de tempel te Jeruzalem.
betekenis: |
  Maria wordt in de tempel gebracht om zelf de levende tempel van God
  te worden: in haar zal God wonen. Steen en voorhang wijken voor een
  mens. God wil bij mensen wonen, niet alleen in een gebouw.

  Wie het woord hoort en bewaart, wordt huis van de levende God. Dit
  feest wijst de weg: toewijding, zodat Christus in ons ruimte krijgt.
