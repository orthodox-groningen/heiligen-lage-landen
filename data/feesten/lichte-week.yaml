samenvatting: |
  Bright Week: van Pascha tot en met Lichte Zaterdag; geen wekelijks vasten.
verhaal: |
  In de Lichte Week (Bright Week) viert de Kerk de Opstanding zonder de
  gebruikelijke woensdag- en vrijdagvasten. De vreugde van Pascha gaat vóór
  ascese; vasten hervat typisch na Thomaszondag (of volgens lokale typikon).
