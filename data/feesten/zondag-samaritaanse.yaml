samenvatting: |
  Ontmoeting bij de put; levend water.
verhaal: |
  Christus ontmoet de Samaritaanse vrouw bij de put (Joh. 4).
betekenis: |
  Hij vraagt water en geeft levend water. Zij die vijf mannen had, wordt
  getuige. Aanbidding is niet op deze berg of die, maar in Geest en
  waarheid.

  Op weg naar Pinksteren: dorst, dan de Geest. Ga, laat de kruik, zeg
  in de stad wat Hij je zei.
referenties:
