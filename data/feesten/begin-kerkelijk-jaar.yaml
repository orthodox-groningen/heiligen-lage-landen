samenvatting: |
  Indictie: begin van het kerkelijk jaar.
verhaal: |
  Op 1 september begint het kerkelijk jaar (indictie).
betekenis: |
  Het jaar van de Kerk begint niet bij de burgerlijke januari, maar
  hier: Christus leest in de synagoge «het jaar van des Heren
  welbehagen» (Luc. 4). Tijd is geen lege kring; zij wordt geopend
  door zijn stem.

  Wie dit begin houdt, zet de dagen onder die lezing: omkeer, barmhartigheid,
  het gunstjaar. Vraag zegen over het jaar dat komt, en leef het als
  tijd die Hem toebehoort.
