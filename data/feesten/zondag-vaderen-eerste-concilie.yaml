samenvatting: |
  Vaderen van Nicea (325); zondag na Hemelvaart.
verhaal: |
  Tussen Hemelvaart en Pinksteren eert de Kerk de Vaderen van Nicea (325),
  die belijden: de Zoon is ware God, van hetzelfde wezen als de Vader.
betekenis: |
  Wie ten hemel vaart is geen schepsel dat God werd, maar de Zoon die
  God is van eeuwigheid. Nicea zegt «van hetzelfde wezen»: redding hangt
  daaraan, niet aan een vrome held.

  Deze zondag valt in de tien dagen van wachten op de Geest. Belijd met
  de 318: licht uit licht, ware God uit ware God — en houd dat credo
  tot Pinksteren.
