id: thomaszondag
soort: feest
bronlaag: nagekeken
cyclus: paascyclus
lage_landen: false
namen:
  primair: Thomaszondag (Antipascha)
  alternatief:
  - Zondag van de ongelovige Thomas
  - Thomaszondag
  - Antipascha
  - Zondag van Thomas
observances:
  - feest
datum:
  stijl: gregoriaans
  paascyclus:
    anker: pascha
    offset_dagen: 7
samenvatting: |
  Eerste zondag na Pascha; belijdenis van Thomas.
verhaal: |
  Thomas ziet de wonden van de Opgestane en belijdt: «Mijn Heer en mijn
  God» (Joh. 20).
betekenis: |
  De Lichte Week is voorbij; het geloof moet nu zonder de nachtkreet
  van Pascha staan. Thomas mag voelen, en buigt. Zalig wie niet ziet
  en toch gelooft — dat woord is voor ons.

  Antipascha: hetzelfde Pascha, acht dagen later. Kom tot de wonden;
  zeg het na. Twijfel die tot belijdenis komt, wordt niet weggestuurd.
