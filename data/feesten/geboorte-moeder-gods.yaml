samenvatting: |
  Geboortefeest van de Allerheiligste Moeder Gods.
verhaal: |
  De geboorte van Maria uit Joachim en Anna wordt gevierd als begin van het heilseconomie-verhaal in de jaarcyclus.
betekenis: |
  Joachim en Anna kregen laat een kind. In hun wachten bereidt God
  iemand die Christus kan ontvangen. Dit feest is het begin van de
  redding, nog vóór Kerst: God werkt door mensen die op Hem hoopten.

  De jaarcyclus opent hier. Wie het woord hoort en bewaart, deelt in
  dezelfde barmhartigheid: Christus wordt geboren voor ons. De Kerk
  viert dit als feestdag, niet als bijzaak van de Moeder Gods.
