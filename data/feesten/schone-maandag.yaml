id: schone-maandag
soort: feest
bronlaag: nagekeken
cyclus: paascyclus
lage_landen: false
namen:
  primair: Schone Maandag (begin Grote Vasten)
  alternatief:
  - Schone Maandag
  - begin Grote Vasten
  - Begin van de Grote Vasten
observances:
  - vasten
datum:
  stijl: gregoriaans
  paascyclus:
    anker: pascha
    offset_dagen: -48
samenvatting: |
  Eerste dag van de Grote Vasten.
verhaal: |
  Eerste weekdag van de Grote Vasten.
betekenis: |
  De veertig dagen zijn begonnen. «Gaan wij aan het werk» — niet om de
  maag, maar om het hart: gebed, onthouding, aalmoezen, op weg naar
  Pascha.

  Schoon is de dag als de ruzie van gisteren is losgelaten. Vasten is
  middel; wie de regel niet aankan, vraagt de priester, en houdt de
  naaste.
referenties:
  - label: "Chrysostomos — Homilie 20 op Matteüs (wanneer gij vast)"
    url: "https://www.newadvent.org/fathers/200120.htm"
    geraadpleegd: "2026-08-21"
    inhoud: "Matteüs 6: vasten niet tot schouwspel; met gebed, niet om gezien te worden."
  - label: "OCA — Het Orthodoxe geloof: vasten in de Grote Vasten"
    url: "https://www.oca.org/orthodoxy/the-orthodox-faith/worship/the-church-year/lenten-fasting"
    geraadpleegd: "2026-08-21"
    inhoud: "Vasten met gebed en barmhartigheid; niet de maag als doel."
  - label: "OCA — Het Orthodoxe geloof: Grote Vasten"
    url: "https://www.oca.org/orthodoxy/the-orthodox-faith/worship/the-church-year/great-lent"
    geraadpleegd: "2026-08-21"
  - label: "OrthodoxWiki — Schone Maandag"
    url: "https://orthodoxwiki.org/Clean_Monday"
    geraadpleegd: "2026-08-16"
