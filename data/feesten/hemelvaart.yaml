samenvatting: |
  Veertig dagen na Pascha; Christus’ hemelvaart.
verhaal: |
  Veertig dagen na Pascha viert de Kerk de Hemelvaart: de opgestane Heer gaat ten hemel en belooft de Geest. Het is een van de grote feesten van het kerkelijk jaar.
betekenis: |
  Hemelvaart is geen man die wegzweeft. De opgestane Heer neemt onze
  menselijkheid mee naar de Vader. Wat in Hem verheerlijkt is, is de
  bestemming van de mens: gemeenschap met God, dieper dan bij de
  schepping alleen.

  Hij gaat weg om bij ons te blijven en ons een plaats te bereiden. Hij
  belooft de Geest, zodat wij getuigen kunnen zijn. «Ik ben met u» is
  geen afscheid, maar de belofte tot Pinksteren en daarna.
