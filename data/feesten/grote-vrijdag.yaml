datum:
  stijl: gregoriaans
  paascyclus:
    anker: pascha
    offset_dagen: -2
samenvatting: |
  Kruisiging en graflegging van de Heer.
verhaal: |
  De Kerk gedenkt kruisiging, dood en graflegging van Christus.
betekenis: |
  Hij hangt tussen twee moordenaars. De één lastert, de ander zegt:
  gedenk mij. Het Kruis scheidt twee wegen. Wij buigen voor het
  grafkleed: dit is geen nederlaag die we later goedpraten, maar de
  overgave waarin de dood al wordt ontmanteld.

  Deze dag is stil en nuchter, tot het graf. Wie niet vasten kan zoals
  het typikon vraagt, komt toch: de wijze rover kwam op het elfde uur.
