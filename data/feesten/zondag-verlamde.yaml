namen:
  primair: Zondag van de verlamde
  alternatief:
  - Zondag van de verlamde man
  - Zondag van de genezing van de verlamde
observances:
  - feest
datum:
  stijl: gregoriaans
  paascyclus:
    anker: pascha
    offset_dagen: 21
samenvatting: |
  Genezing bij Betesda; derde zondag na Pascha.
verhaal: |
  Christus geneest de verlamde bij Betesda (Joh. 5).
betekenis: |
  Achtendertig jaar wachten bij het water; Hij zegt: sta op, neem je bed.
  De Opgestane maakt lopen wat lag. Zonde en verlamming horen bijeen in
  dit evangelie: «zondig niet meer.»

  In de vijftig dagen is genezing Pascha in het lichaam. Sta op. Draag
  wat je droeg als bed — nu als teken dat Hij sprak.
