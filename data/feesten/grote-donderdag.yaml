samenvatting: |
  Laatste Avondmaal; voetwassing; overlevering aan het lijden.
verhaal: |
  Christus wast de voeten van de leerlingen, stelt het Avondmaal in en
  gaat naar Getsemane.
betekenis: |
  Hij geeft zichzelf als brood en wijn, en buigt als dienaar. Wie eet
  en drinkt, wordt in dat geven opgenomen. De voetwassing is geen
  toneel: «zoals Ik u gedaan heb, doet ook gij.»

  In Getsemane vraagt Hij: waak met Mij. De twaalf Evangelieën van de
  avonddienst houden ons bij Hem tot het kruis. Kom tot de tafel; blijf
  wakker.
