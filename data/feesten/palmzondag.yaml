samenvatting: |
  Christus’ intocht in Jeruzalem; begin van de Heilige Week.
verhaal: |
  Met palmtakken en hosanna’s viert de Kerk de intocht van de Heer in Jeruzalem. Tegelijk opent Palmzondag de Heilige Week die naar het lijden en Pascha leidt.
betekenis: |
  De menigte juicht Hem toe als koning. Een paar dagen later klinkt
  «kruisig Hem». Palmzondag zet ons in diezelfde menigte: wie hosanna
  zingt, staat daar ook. De takken horen bij het kruis: wie juicht,
  gaat met Hem de Heilige Week in.

  Hij komt als koning op een veulen, niet om te heersen zoals de wereld
  heerst, maar om zichzelf te geven. Hosanna betekent: red toch. Dat
  gebed blijft staan tot Pascha.
