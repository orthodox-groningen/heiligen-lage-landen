samenvatting: |
  Zondag direct vóór Kerst: de heilige Vaderen volgens het vlees van de Heer.
verhaal: |
  Deze zondag is de laatste zondag vóór 25 december (18–24 december). De
  lezingen noemen de geslachtslijst van Christus (Matteüs 1) en de
  geloofsgetuigen van het Oude Verbond (Hebreeën 11). Als Kerst zelf op
  zondag valt, is deze zondag 18 december.
