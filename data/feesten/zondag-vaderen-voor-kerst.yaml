samenvatting: |
  Zondag direct vóór Kerst: de heilige Vaderen volgens het vlees van de Heer.
verhaal: |
  De laatste zondag vóór 25 december: de geslachtslijst van Christus
  (Matt. 1) en de geloofsgetuigen van het Oude Verbond (Heb. 11).
betekenis: |
  Het Woord neemt een geslacht aan: Abraham, David, ballingschap, Jozef.
  Geen mythe die uit de lucht valt, maar een kind uit een lijn van zondaars
  en rechtvaardigen. Hebreeën 11: zij stierven in geloof, zonder het
  beloofde al in handen te hebben.

  Deze week is Kerst nabij. Lees de namen; dank dat Hij ons vlees werd.
  De paramonie volgt; houd de vasten tot de nacht van het feest.
