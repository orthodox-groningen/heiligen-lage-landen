samenvatting: |
  De aartsengel Gabriël kondigt de geboorte van Christus aan Maria aan.
verhaal: |
  Op dit feest wordt herdacht dat Maria ja zegt op Gods uitnodiging; het Woord wordt vlees.
betekenis: |
  Hier begint onze redding: de Zoon van God wordt Zoon van de Maagd.
  God dwingt niet. Maria antwoordt: «Mij geschiede naar uw woord.»
  Door dat vrije ja wordt het eeuwige geheim openbaar: God wordt mens.

  Het feest is ook onze ontvangst van dat bericht. Met de engel groeten
  wij haar, en leren wij hetzelfde: ruimte maken, zodat Christus in ons
  geboren kan worden.
