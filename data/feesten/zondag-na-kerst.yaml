samenvatting: |
  Eerste zondag ná Kerst: Jozef de Verloofde, David de koning en Jakobus
  de Broeder des Heren.
verhaal: |
  De zondag ná 25 december (26 december–1 januari) eert de familie rond
  het Kind: Jozef, David en Jakobus. Valt die zondag op 26 december, dan
  is er ook de synaxis van de Moeder Gods; valt ze op 1 januari, dan de
  Besnijdenis. Deze kalender toont beide; de lezing van het grootfeest
  gaat vóór als ze samenvallen.
