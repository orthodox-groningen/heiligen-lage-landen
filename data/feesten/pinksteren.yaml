samenvatting: |
  Vijftig dagen na Pascha; gave van de Heilige Geest.
verhaal: |
  Op Pinksteren daalt de Heilige Geest neer op de apostelen. Het feest voltooit de paascyclus van vijftig dagen en viert de geborenwording van de Kerk in de kracht van de Geest. Vaak wordt ook de Allerheiligste Drie-eenheid bijzonder herdacht.
betekenis: |
  Vijftig dagen na Pascha komt de Geest die Christus beloofde. De
  apostelen ontvangen kracht om te getuigen; de Kerk wordt zichtbaar
  in de wereld. Tegelijk wordt de Drie-eenheid openbaar: Vader, Zoon
  en Geest, God die zich geheel geeft.

  Pinksteren is niet alleen toen. Wie gedoopt en gezalfd is, heeft
  dezelfde Geest ontvangen. Wij zijn bedoeld als tempel waarin God
  woont. De verwarring van talen wordt omgekeerd: de Geest roept tot
  eenheid.
