samenvatting: |
  Opwekking van Lazarus; vooravond van Palmzondag.
verhaal: |
  Christus wekt Lazarus uit de doden (Joh. 11), vier dagen in het graf.
betekenis: |
  Lazarus komt tevoorschijn omdat Christus de opstanding en het leven
  is. Dit is geen klein wonder vóór Palmen: wie in het graf ligt, wordt
  geroepen. De veertig dagen zijn vervuld; de weg naar Jeruzalem gaat
  open.

  De Kerk viert al iets van Pascha, nog in vasten. Wie dit ziet, gaat
  met Hem mee, niet om het graf te ontkennen, maar omdat Hij erin
  spreekt.
