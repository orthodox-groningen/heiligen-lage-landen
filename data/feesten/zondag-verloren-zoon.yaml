samenvatting: |
  Gelijkenis van de barmhartige vader; oproep tot terugkeer.
verhaal: |
  De gelijkenis van de verloren zoon (Luc. 15): hij keert terug; de vader
  rent hem tegemoet.
betekenis: |
  Het huis van de Vader blijft open. Wie verkwist heeft, mag opstaan en
  gaan. De oudste broer telt verdiensten; de vader viert de dode die
  leeft.

  Voorbereiding op de Vasten is thuiskomen, niet een prestatie. Zeg:
  ik heb gezondigd — en laat je omarmen.
