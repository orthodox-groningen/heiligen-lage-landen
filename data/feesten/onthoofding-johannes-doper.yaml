samenvatting: |
  Gedachtenis van de marteldood van de Voorloper.
verhaal: |
  Johannes wordt onthoofd op bevel van Herodes (Matt. 14).
betekenis: |
  De Voorloper sterft omdat hij de waarheid zegt: ook een koning staat
  niet boven Gods gebod. Zijn hoofd op een schotel is geen einde van
  de stem — de stem heeft al gewezen naar het Lam.

  Daarom is deze feestdag een vastendag: geen feestmaal over een
  moord. Wie hem gedenkt, kiest de waarheid boven gemak.
