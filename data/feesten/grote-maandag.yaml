samenvatting: |
  Eerste dag van de Heilige Week; Jozef de Alschone; onvruchtbare vijgenboom.
verhaal: |
  De dienst gedenkt de kuise Jozef en de onvruchtbare vijgenboom.
betekenis: |
  De Bruidegom komt in de nacht. De vijgenboom heeft blad zonder vrucht:
  religie zonder liefde. Jozef blijft trouw in vreemd land. De metten
  zeggen: laten we met de Heer naar Jeruzalem opgaan — niet om het
  lijden te spelen, maar om met Hem te sterven en te leven.

  Waak. Het vasten van deze dagen maakt daar ruimte voor; het is geen
  doel op zich.
