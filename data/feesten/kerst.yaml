samenvatting: |
  Geboorte van onze Heer Jezus Christus.
verhaal: |
  Christus wordt geboren in Bethlehem. De feestdatum is 25 december —
  dezelfde dagnaam in de nieuwe (Gregoriaanse) en oude (Juliaanse) kalender.
  (Parochies die de oude kalender volgen vieren liturisch op Juliaans 25 december,
  wat burgerlijk later in januari valt; deze site toont de feestdatum zelf.)
