samenvatting: |
  Geboorte van onze Heer Jezus Christus.
verhaal: |
  Christus wordt geboren in Bethlehem. De feestdatum is 25 december —
  dezelfde dagnaam in de nieuwe (Gregoriaanse) en oude (Juliaanse) kalender.
  (Parochies die de oude kalender volgen vieren liturisch op Juliaans 25 december,
  wat burgerlijk later in januari valt; deze site toont de feestdatum zelf.)
betekenis: |
  De eeuwige Zoon wordt een kind. God is niet ver weg: Hij is «God met
  ons», in een grot, bij herders en wijzen. Hij wordt mens opdat wij
  kinderen van de Vader zouden worden. Wie Hem ontvangt, is geen slaaf
  meer maar zoon of dochter.

  De Kerk komt tot dit feest door de paramonie: koninklijke uren en
  nuchtere voorbereiding, het feest ná die dag, niet ervoor. Wie tot
  de kribbe komt, geeft als gave de wil om naar Zijn wil te leven.
