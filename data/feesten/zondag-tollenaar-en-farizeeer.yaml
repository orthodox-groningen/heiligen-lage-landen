samenvatting: |
  Opening van het Triodion; les over ootmoedig gebed.
verhaal: |
  Christus vertelt de gelijkenis van de tollenaar en de Farizeeër (Luc. 18).
betekenis: |
  Twee mannen bidden. De één somt verdiensten op en veracht de ander; de
  tollenaar slaat op de borst: wees mij zondaar genadig. Gerechtvaardigd
  gaat hij naar huis, niet de andere.

  Het Triodion begint hier: ootmoed, geen vasten om te scoren. Deze week
  is vastenvrij, zodat niemand zich verheft op onthouding.
