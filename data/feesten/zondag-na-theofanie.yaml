samenvatting: |
  Eerste zondag ná Theofanie.
verhaal: |
  De zondag ná 6 januari (7–12 januari) sluit de Theofanie-viering af met
  de lezing van het begin van Christus’ prediking. Valt die zondag op
  7 januari, dan is er ook de synaxis van Johannes de Doper; de lezing
  van die synaxis gaat dan vóór.
