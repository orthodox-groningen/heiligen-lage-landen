samenvatting: |
  Het ontslapen (dood en opname) van de Moeder Gods.
verhaal: |
  De Kerk viert het einde van het aardse leven van de Moeder Gods en haar overgang tot het eeuwige leven.
betekenis: |
  Maria sterft zoals mensen sterven. Haar Zoon wekt haar op en neemt
  haar aan in het leven van het Rijk. Het graf houdt haar niet. Wat in
  haar voltooid is, is de belofte voor wie het woord hoort en bewaart:
  de dood heeft niet het laatste woord.

  De twee weken vóór dit feest horen erbij: de Kerk nadert het Ontslapen
  nuchter, zoals zij Kerst en Pascha nadert. De leiding is omkeer en
  hoop, geen treurnis zonder opstanding.
