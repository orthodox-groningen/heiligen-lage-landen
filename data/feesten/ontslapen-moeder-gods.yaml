samenvatting: |
  Het ontslapen (dood en opname) van de Moeder Gods.
verhaal: |
  De Kerk viert het einde van het aardse leven van de Moeder Gods en haar overgang tot het eeuwige leven.
betekenis: |
  Maria sterft zoals mensen sterven. Haar Zoon wekt haar op en neemt
  haar aan in het leven van het Rijk. Wie de Moeder van het Leven is,
  wordt zelf naar het leven overgebracht. Het graf houdt haar niet.

  Haar lot is de belofte voor wie het woord hoort en bewaart: dood
  heeft niet het laatste woord. Wat in Maria al voltooid is, is de
  weg die Christus voor ieder opent die leeft zoals zij leefde —
  nederig, gehoorzaam, vol liefde.
