  primair: Allerzielen-zaterdag (vóór Vleesvaarwel)
  alternatief:
  - Allerzielen-zaterdag
  - Zaterdag vóór Vleesvaarwel
observances:
  - feest
datum:
  stijl: gregoriaans
  paascyclus:
    anker: pascha
    offset_dagen: -57
samenvatting: |
  Gedachtenis van alle overledenen vóór de Vleesvaarwelzondag.
verhaal: |
  De Kerk gedenkt allen die in geloof zijn ontslapen, de dag vóór het
  evangelie van het Laatste Oordeel.
betekenis: |
  Voor het oordeel over de levenden bidt de Kerk voor de doden. Zij zijn
  niet weg: Christus is opgestaan, en de doden in Hem slapen in hoop.
  Voorbede is geen magie; het is de liefde van het lichaam dat zijn
  leden niet laat vallen.

  Noem hen. Breng hun namen. De zondag erna vraagt wat we de minsten
  deden — ook de ontslapenen horen bij die minsten als wij hen vergeten.
