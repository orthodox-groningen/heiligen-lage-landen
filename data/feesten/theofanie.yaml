samenvatting: |
  Openbaring van de Heilige Drie-eenheid bij de doop van Christus in de Jordaan.
verhaal: |
  Bij de doop van Christus in de Jordaan openbaart God zich als Vader (stem), Zoon (Christus) en Heilige Geest (duif). Theofanie is een van de grote vaste feesten.
betekenis: |
  In de Jordaan laat God zien wie Hij is: de Zoon staat in het water, de
  Geest daalt neer, de Vader spreekt. Christus buigt het hoofd en
  ontvangt de doop zonder zonde: nederigheid opent de hemel. In de doop
  deelt de mens in ditzelfde geheim: sterven en opstaan met Hem.

  Daarom zegent de Kerk het water, drinkt en sprenkelt het, en wijdt
  huizen. Schepping is niet afgeschreven. Nog in de dagen van het feest
  klinkt dezelfde roep als aan de Jordaan: bekeert u, het Koninkrijk is
  nabij.
