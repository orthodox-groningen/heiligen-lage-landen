samenvatting: |
  Openbaring van de Heilige Drie-eenheid bij de doop van Christus in de Jordaan.
verhaal: |
  Bij de doop van Christus in de Jordaan openbaart God zich als Vader (stem), Zoon (Christus) en Heilige Geest (duif). Theofanie is een van de grote vaste feesten.
betekenis: |
  In de Jordaan laat God zien wie Hij is: de Zoon staat in het water, de
  Geest daalt neer, de Vader spreekt. Theofanie is niet alleen een
  herinnering aan één moment. In de doop deelt de mens in ditzelfde
  geheim: sterven en opstaan met Christus, kind van de Vader worden,
  de Heilige Geest ontvangen.

  Daarom zegent de Kerk op dit feest het water. Schepping is niet
  afgeschreven; God heiligt de wereld waarin wij leven, zodat het
  gewone water tot teken van nieuw leven wordt.
