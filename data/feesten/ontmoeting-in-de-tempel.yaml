samenvatting: |
  Christus wordt in de tempel gebracht; Simeon en Anna begroeten Hem.
verhaal: |
  Veertig dagen na Kerst wordt het Kind naar de tempel gebracht. De rechtvaardige Simeon herkent Hem als het heil van God.
betekenis: |
  Wie de wereld schiep, ligt als kind in Simeons armen. De Gever van de
  Wet vervult de Wet zelf. Simeon mag heengaan in vrede: zijn ogen
  hebben Gods redding gezien, licht voor de volken.

  Dat is ook onze ontmoeting. Veertig dagen na Kerst komt de Kerk de
  Heer tegemoet; wie Hem heeft gezien, kan in vrede leven en sterven.
  Het heil is deze Christus, geen idee.
