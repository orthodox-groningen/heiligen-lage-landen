samenvatting: |
  Genezing van de blindgeborene.
verhaal: |
  Christus geneest de blindgeborene (Joh. 9).
betekenis: |
  Hij is het licht van de wereld. Slijk op de ogen, wassen in Siloam:
  wie nooit zag, ziet. De zienden die Hem oordelen, blijven blind.

  Geloof opent. Vraag niet eerst wiens zonde het was; vraag het Licht.
  Deze zondag valt vóór Hemelvaart: zie, en volg waar Hij heen gaat.
