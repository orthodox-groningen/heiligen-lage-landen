samenvatting: |
  Groot feest in de Russische Kerk: de Moeder Gods spreidt haar omophorion over de gelovigen.
verhaal: |
  In de Blachernenkerk te Constantinopel verschijnt de Moeder Gods en
  spreidt haar omophorion over het volk.
betekenis: |
  Zij dekt de gelovigen met haar sluier: niet als een tweede god, maar
  als moeder die bidt. Wie onder dat kleed gaat staan, zoekt geen magie,
  maar de bescherming van Christus door haar voorbede.

  Dit is geen van de twaalf grootfeesten, wel een groot feest in de
  Slavische kerken. De leiding is dezelfde: toevlucht, omkeer, bid voor
  de stad en voor elkaar.
