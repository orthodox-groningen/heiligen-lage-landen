samenvatting: |
  Groot feest in de Russische Kerk: de Moeder Gods spreidt haar omophorion over de gelovigen.
verhaal: |
  Pokrov (1 oktober) hoort niet bij de twaalf grote feesten, maar is in de
  Moskou-traditie (en ROCOR) een groot feest van de Moeder Gods. De
  herinnering is de verschijning in de Blachernenkerk te Constantinopel,
  waarbij de Theotokos de stad beschermde.
