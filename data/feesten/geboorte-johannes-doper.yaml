samenvatting: |
  Feestdag van de geboorte van de Voorloper.
verhaal: |
  De geboorte van Johannes, zoon van Zacharias en Elisabeth (Luc. 1).
betekenis: |
  De Voorloper wordt geboren zodat de stem in de woestijn kan klinken:
  bereidt de weg. Hij moet wassen, Christus toenemen. Zijn geboorte is
  al omkeer, nog vóór de Jordaan.

  De Kerk viert dit in de langste dagen: het licht van de Voorloper wijst
  naar het ware Licht. Wie hem eert, maakt ruimte — niet voor zichzelf.
