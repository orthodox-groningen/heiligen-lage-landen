samenvatting: |
  Zalving te Bethanië; verraad van Judas.
verhaal: |
  De vrouw zalft Christus in Bethanië; Judas spreekt over geld en verraad.
betekenis: |
  Twee wegen: zij geeft wat ze heeft en kust zijn voeten; hij verkoopt
  Hem. De Kerk zet ons naast hen beiden. Omkeer is mogelijk tot het
  laatste uur; berekening van de liefde is verraad.

  Wie deze dag houdt, kiest de zalving: geen spijt later, maar liefde
  nu, terwijl Hij nog onder ons is op weg naar het kruis.
