samenvatting: |
  Tweede zondag vóór Kerst: herdenking van de Voorvaderen van Christus.
verhaal: |
  De Kerk eert de rechtvaardigen van het Oude Verbond die de komst van
  Christus verwachtten (tweede zondag vóór 25 december).
betekenis: |
  Van Adam tot de laatste profeet: God laat de belofte niet vallen. Zij
  zagen Hem niet zoals wij Kerst vieren, maar leefden van dezelfde hoop.
  De geslachtslijn is geen lijst van namen; het is geduld tot het Woord
  vlees wordt.

  Twee weken voor Kerst: leer wachten zoals zij. De vasten van de geboorte
  is dat wachten, geen stemming.
