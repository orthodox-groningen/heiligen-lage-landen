samenvatting: |
  Tweede zondag vóór Kerst: herdenking van de Voorvaderen van Christus.
verhaal: |
  De Zondag van de Voorvaderen valt op de tweede zondag vóór 25 december
  (11–17 december). De Kerk eert de rechtvaardigen van het Oude Verbond
  die de komst van Christus verwachtten. Als 25 december zelf zondag is,
  valt deze zondag op 11 december, niet op het feest.
