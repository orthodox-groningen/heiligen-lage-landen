samenvatting: |
  Eerste zondag ná 10 oktober (11–17 oktober): de Vaderen van het
  Zevende Oecumenische Concilie (Nicea 787), die de iconenverering
  herstelden.
verhaal: |
  Nicea II (787) herstelt de verering van de heilige beelden: omdat de
  Zoon vlees werd, mag zijn gezicht worden getoond.
betekenis: |
  Wie de icoon weigert, raakt het vlees van Christus. De eer aan het
  beeld gaat naar het prototype; dat is geen afgoderij. Dezelfde belijdenis
  klinkt op de Zondag van de Orthodoxie; deze zondag eert de vaderen
  die haar conciliair vastzetten.

  Kus de icoon. Het geloof van 787 is het geloof van de Kerk, niet een
  smaak in kunst.
