samenvatting: |
  Eerste zondag ná 10 oktober (11–17 oktober): de Vaderen van het
  Zevende Oecumenische Concilie (Nicea 787), die de iconenverering
  herstelden.
verhaal: |
  Deze zondag valt strikt ná 10 oktober, dus tussen 11 en 17 oktober.
  Als 10 oktober zelf zondag is, is het 17 oktober. De lezingen
  (Titus 3, Hebreeën 13, Johannes 17) gedenken de vaderen die het
  geloof van de Kerk over de heilige beelden beleden.
