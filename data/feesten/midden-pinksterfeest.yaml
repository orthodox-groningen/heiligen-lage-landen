namen:
  primair: Midden-Pinksterfeest
  alternatief:
  - Mid-Pinksteren
  - Middenfeest
observances:
  - feest
datum:
  stijl: gregoriaans
  paascyclus:
    anker: pascha
    offset_dagen: 24
samenvatting: |
  Halverwege tussen Pascha en Pinksteren.
verhaal: |
  Halverwege de vijftig dagen leert Christus in de tempel (Joh. 7).
betekenis: |
  «Als iemand dorst heeft, hij kome tot Mij en drinke.» Het midden
  tussen Pascha en Pinksteren is geen pauze: het water is beloofd, de
  Geest nog niet in de volle uitstorting van Pinksteren.

  Dorst. Blijf in de vijftig dagen; drink al van het evangelie, in
  verwachting van de Geest.
