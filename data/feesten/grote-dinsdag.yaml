samenvatting: |
  Heilige Week; gelijkenissen van waakzaamheid.
verhaal: |
  De dienst leest de gelijkenissen van de tien maagden en van de talenten.
betekenis: |
  De Bruidegom komt. Vijf maagden hebben olie, vijf niet: waakzaamheid
  is geen stemming, maar een brandend lampje. De talenten vragen trouw
  met wat is toevertrouwd, tot Hij terugkomt.

  «Zie, de Bruidegom komt te middernacht» — sta op, wees niet zwaar van
  slaap. Deze dag is wacht, geen uitstel tot Pascha.
