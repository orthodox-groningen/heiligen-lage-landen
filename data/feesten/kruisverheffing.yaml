samenvatting: |
  Verheffing van het Heilig Kruis.
verhaal: |
  Het Kruis van Christus wordt verhoogd en vereerd als teken van overwinning over de dood.
betekenis: |
  Het Kruis wordt omhooggeheven, niet als wapen van een rijk, maar als
  het teken dat de wereld bewaart. Christus laat zich kruisigen; wie
  tot Hem behoort, sterft en staat met Hem op. Het teken van het Kruis
  hoort bij de mysteries: het graveren wij in de ziel, niet alleen op
  de borst.

  Wie voor het Kruis buigt, zegt: wij horen bij een rijk dat niet van
  deze wereld is. Daarom is deze feestdag ook een vastendag: omkeer,
  geen triomf zonder lijden.
