samenvatting: |
  Verheffing van het Heilig Kruis.
verhaal: |
  Het Kruis van Christus wordt verhoogd en vereerd als teken van overwinning over de dood.
betekenis: |
  Het Kruis wordt omhooggeheven, niet als wapen van een rijk, maar als
  het enige teken waaraan de Kerk zich geheel toevertrouwt. Redding
  komt niet door aardse overwinningen, maar doordat Christus zich laat
  kruisigen en wij met Hem sterven en opstaan.

  Wie voor het Kruis buigt, zegt: wij horen bij een rijk dat niet van
  deze wereld is. Daarom is deze dag ook een vastendag: het Kruis
  vraagt omkeer, geen triomf zonder lijden.
