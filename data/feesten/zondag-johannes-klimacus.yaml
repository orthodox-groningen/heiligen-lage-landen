samenvatting: |
  Gedachtenis van Johannes van de Ladder.
verhaal: |
  Gedachtenis van Johannes Klimacus, schrijver van *De Ladder*.
betekenis: |
  Bekering is een ladder: trede na trede, niet in één sprong. Hoogmoed
  gooit om; nederigheid houdt vast. Johannes schrijft voor monniken;
  de Kerk leest hem in de Vasten voor ieder die opstaat en valt.

  Klim. Wie struikelt, begint opnieuw. De Ladder is geen wet om anderen
  te meten, maar een spiegel voor jezelf.
