samenvatting: |
  Einde van de Boterweek; wederzijdse vergeving vóór de Grote Vasten.
verhaal: |
  Op Vergevingszondag vraagt de gemeenschap elkaar om vergeving en begint ’s avonds de Grote Vasten. De Kerk gedenkt de verdrijving uit het paradijs en wijst op terugkeer door vasten, gebed en barmhartigheid. Kaas, eieren en andere zuivelproducten worden na deze dag traditioneel gemeden tot Pascha.
