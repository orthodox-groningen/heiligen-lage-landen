id: vergevingszondag
soort: feest
bronlaag: nagekeken
cyclus: paascyclus
lage_landen: false
namen:
  primair: Vergevingszondag
  alternatief:
  - Zuivelvaarwel
  - Zondag van de verdrijving uit het paradijs
  - Kaasvaarwel
  - Cheesefare
observances:
  - feest
datum:
  stijl: gregoriaans
  paascyclus:
    anker: pascha
    offset_dagen: -49
samenvatting: |
  Einde van de Boterweek; wederzijdse vergeving vóór de Grote Vasten.
verhaal: |
  De Kerk gedenkt de verdrijving uit het paradijs (Gen. 3).
betekenis: |
  Adam weent buiten de poort. De Vasten is de weg terug, niet een straf
  op zich. Wie elkaar niet vergeeft, kan die weg niet op: «indien gij
  de mensen hun misdaden niet vergeeft, zal uw Vader de uwe niet
  vergeven.»

  Aan de vespers buigt men tot elkaar: vergeef mij. Daarna begint de
  nuchtere tafel. Zuivel blijft tot Pascha achter; wrok mag niet mee.
referenties:
  - label: "Chrysostomos — Homilie 19 op Matteüs (Onze Vader: vergeef ons)"
    url: "https://www.newadvent.org/fathers/200119.htm"
    geraadpleegd: "2026-08-21"
    inhoud: "Matteüs 6: vergeving van schulden; wie niet vergeeft, wordt niet vergeven."
  - label: "OCA — Het Orthodoxe geloof: Grote Vasten"
    url: "https://www.oca.org/orthodoxy/the-orthodox-faith/worship/the-church-year/great-lent"
    geraadpleegd: "2026-08-21"
    inhoud: "Verdrijving uit het paradijs; wederzijdse vergeving vóór de veertig dagen."
  - label: "OrthodoxWiki — Vergevingszondag"
    url: "https://orthodoxwiki.org/Forgiveness_Sunday"
    geraadpleegd: "2026-08-16"
  - label: "OCA — Het Orthodoxe geloof: vasten in de Grote Vasten"
    url: "https://www.oca.org/orthodoxy/the-orthodox-faith/worship/the-church-year/lenten-fasting"
    geraadpleegd: "2026-08-21"
