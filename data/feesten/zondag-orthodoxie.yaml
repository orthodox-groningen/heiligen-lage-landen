id: zondag-orthodoxie
soort: feest
bronlaag: nagekeken
cyclus: paascyclus
lage_landen: false
namen:
  primair: Eerste zondag van de Vasten (Zondag van de Orthodoxie)
  alternatief:
  - Eerste zondag van de Vasten
  - Zondag van de Orthodoxie
  - Orthodoxiezondag
observances:
  - feest
  - vasten
datum:
  stijl: gregoriaans
  paascyclus:
    anker: pascha
    offset_dagen: -42
samenvatting: |
  Herstel van de iconenverering; eerste vastenzondag.
verhaal: |
  Deze zondag viert het herstel van de iconen in 843 na de iconoclastische strijd. De Orthodoxy-processie belijdt het geloof van de Kerk en de rechtmatigheid van heilige beelden als vensters op de incarnatie.
referenties:
