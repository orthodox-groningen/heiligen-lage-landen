    url: "https://orthodoxwiki.org/Sunday_of_Orthodoxy"
    geraadpleegd: "2026-08-16"
  - label: "OrthodoxWiki — Grote Vasten"
    url: "https://orthodoxwiki.org/Great_Lent"
    geraadpleegd: "2026-08-16"
