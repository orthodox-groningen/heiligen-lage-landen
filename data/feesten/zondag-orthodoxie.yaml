samenvatting: |
  Herstel van de iconenverering; eerste vastenzondag.
verhaal: |
  In 843 herstelt de Kerk de verering van de iconen.
betekenis: |
  Wie het vlees van Christus ontkent, kan zijn gezicht niet tonen. De
  icoon is geen afgod: God is mens geworden, dus mag de mens Hem
  afbeelden en kussen. Dat is het geloof van de Kerk, niet een smaak.

  Op deze zondag draagt men de iconen. Buig, kus, belijd: de Zoon nam
  waarlijk vlees aan. Vasten zonder die belijdenis is leeg.
