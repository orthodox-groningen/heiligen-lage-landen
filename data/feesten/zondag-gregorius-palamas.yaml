samenvatting: |
  Gedachtenis van de heilige Gregorius Palamas.
verhaal: |
  Gedachtenis van Gregorius Palamas (†1359).
betekenis: |
  God is onkenbaar in zijn wezen, maar deelt zich mee: licht, genade,
  gemeenschap. Palamas verdedigt dat gebed geen lege techniek is; de
  mens kan waarlijk tot God komen, zoals de leerlingen op Thabor.

  De tweede vastenzondag zegt: de Vasten is ontmoeting, niet alleen
  onthouding. Bid de naam van Jezus; verwacht het licht, niet jezelf.
