datum:
  waarde: "01-01"
  stijl: juliaans
samenvatting: |
  Het feest van de Besnijdenis des Heren volgens de vaste jaarcyclus.
verhaal: |
  Op de achtste dag wordt het Kind besneden en krijgt Hij de naam Jezus
  (Luc. 2,21).
betekenis: |
  Hij die de Wet gaf, onderwerpt zich aan de Wet. De eeuwige Zoon wordt
  een Joods kind onder het verbond, tot de laatste letter. Zijn naam
  is Jezus: God redt.

  Acht dagen na Kerst is de vreugde nog niet voorbij, en de nederigheid
  niet. Wie Hem volgt, laat zich onder dezelfde trouw scharen: geen
  omweg om het vlees en het verbond heen.
