id: synaxis-gabriel
soort: feest
bronlaag: nagekeken
cyclus: jaar
lage_landen: false
namen:
  primair: Synaxis van de aartsengel Gabriël
  alternatief:
  - Synaxis van Gabriël
  - Sobor van de aartsengel Gabriël
datum:
  waarde: "03-26"
  stijl: juliaans
samenvatting: |
  Dag na de Aankondiging: herdenking van de aartsengel Gabriël.
verhaal: |
  Op 26 maart viert de Kerk de synaxis van de aartsengel Gabriël, die Maria de blijde boodschap bracht. De Aankondiging heeft in het Slavische typikon geen lang nafeest; deze synaxis is de dag erna.
