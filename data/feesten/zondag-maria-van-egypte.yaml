id: zondag-maria-van-egypte
soort: feest
bronlaag: nagekeken
cyclus: paascyclus
lage_landen: false
namen:
  primair: Vijfde zondag van de Vasten (Maria van Egypte)
  alternatief:
  - Vijfde zondag van de Vasten
  - Maria van Egypte
  - Zondag van Maria van Egypte
observances:
  - feest
  - vasten
datum:
  stijl: gregoriaans
  paascyclus:
    anker: pascha
    offset_dagen: -14
samenvatting: |
  Gedachtenis van de heilige Maria van Egypte.
verhaal: |
  Gedachtenis van Maria van Egypte, van zondares tot woestijnheilige.
betekenis: |
  Geen verleden is te zwaar. Zij die niet eens de kerk in kon, wordt
  door het Kruis en de Moeder Gods omgekeerd en leeft in de woestijn.
  Haar leven wordt in de Vasten voorgelezen: hoop voor wie laat komt.

  Durf beginnen. Wie denkt «voor mij is het te laat», hoort haar naam
  op deze zondag.
