samenvatting: |
  Begin van de voorbereiding op de Grote Vasten; evangelie van Zacheüs.
verhaal: |
  Zacheüs klimt in een boom om Christus te zien (Luc. 19).
betekenis: |
  Wie te klein is, zoekt een plek om Hem te zien. Christus gaat mee naar
  huis. Omkeer is geen stemming: de tollenaar geeft terug wat hij nam.

  Deze zondag opent de weg naar de Vasten. Verlangen gaat vóór de regel:
  eerst Hem willen zien, dan de tafel laten.
