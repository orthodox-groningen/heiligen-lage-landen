samenvatting: |
  Angelsaksische missionaris; aartsbisschop van Mainz; martelaar bij
  Dokkum. Feestdag 5 juni.
betekenis_lage_landen: |
  Bonifatius (Wynfrith) werkte met en na Willibrord in Frisia en Utrecht,
  hervormde de Frankische kerk en stierf op 5 juni 754 bij Dokkum, met
  tientallen metgezellen, tijdens een vormseltocht onder de Friezen. Dat
  martelaarschap op Friese grond is het keerpunt van de noordelijke
  missie: Utrecht bleef, de Friese heidenen kregen een bloedgetuige.
  OrthodoxWiki en het Heiligenlexikon bevestigen die lijn.
verhaal: |
  Geboren in Wessex (circa 672–675), monnik te Exeter en Nursling, ging
  hij in 716 en opnieuw in 718 naar het vasteland. Paus Gregorius II gaf
  hem de naam Bonifatius. Hij werkte in Hessen, Thüringen en Beieren,
  werd in 722 bisschop, later aartsbisschop van Mainz, en kroonde Pepijn
  de Korte. Tegen het einde van zijn leven keerde hij naar Frisia terug.
  Bij Dokkum werd hij met zijn gevolg vermoord. Zijn relieken rusten in
  Fulda; Dokkum blijft de Nederlandse martelaarsplaats.

  De vita van Willibald van Mainz (achtste eeuw) is de hoofdbron; latere
  wonderverhalen (onder meer de eik van Geismar) horen bij de Duitse
  missie, niet bij Dokkum.
