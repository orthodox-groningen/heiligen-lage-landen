selectie_toelichting: >-
  Zelf niet in de Lage Landen; leidde te Rath Melsigi missionarissen op
  (o.a. Willibrord). Indirecte invloed — deur open, geen actieve jacht.
selectie_toelichting_publiek: |
  Egbert bleef in Ierland (Rath Melsigi) en kwam zelf niet naar de Friese
  of Nederlandse missie. Wel leidde en spoorde hij missionarissen aan die
  wél hier werkten — waaronder Willibrord. Titus Brandsma noemde die
  rol instrumenteel voor de kerstening van de Lage Landen.

  Strikt genomen voldoet hij niet aan «zelf hier geweest én hier iets
  gedaan». Omdat de invloed reëel maar **indirect** is, houden we hem
  als grensgeval: de deur blijft open, zonder dit soort heiligen actief
  te gaan verzamelen.
