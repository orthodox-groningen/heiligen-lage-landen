    url: "https://www.oca.org/fs/sermons/the-paschal-sermon"
    geraadpleegd: "2026-08-21"
    inhoud: "De tafel is gereed; wie op het elfde uur komt, wordt niet beschaamd."
  - label: "OCA — Het Orthodoxe geloof: Heilige Week"
    url: "https://www.oca.org/orthodoxy/the-orthodox-faith/worship/the-church-year/holy-week"
    geraadpleegd: "2026-08-21"
    inhoud: "De metten van Grote Maandag: met de Heer opgaan naar Jeruzalem."
  - label: "OCA — Het Orthodoxe geloof: vasten in de Grote Vasten"
    url: "https://www.oca.org/orthodoxy/the-orthodox-faith/worship/the-church-year/lenten-fasting"
    geraadpleegd: "2026-08-21"
    inhoud: "Vasten als wacht en omkeer, niet als doel op zich."
  - label: "OrthodoxWiki — Holy Week"
    url: "https://orthodoxwiki.org/Holy_Week"
    geraadpleegd: "2026-08-16"
namen:
