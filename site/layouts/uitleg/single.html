{{ define "main" }}
<article class="page uitleg-page{{ with .Params.uitleg_stijl }} uitleg-{{ . }}{{ end }}">
  <h1>{{ .Title }}</h1>
  {{ .Content }}
  <p class="hint uitleg-nav">
    {{ $stijl := .Params.uitleg_stijl | default "" }}
    {{ if strings.HasSuffix $stijl "-technisch" }}
      {{ $ouder := strings.TrimSuffix "-technisch" $stijl }}
      <a href="{{ printf "uitleg/%s/" $ouder | relURL }}">Terug naar de uitleg</a>
      ·
      <a href="{{ "uitleg/" | relURL }}">Alle uitleg</a>
      ·
      <a href="{{ "beheer/" | relURL }}">Voor beheerders</a>
    {{ else }}
      <a href="{{ "uitleg/" | relURL }}">Alle uitleg</a>
    {{ end }}
  </p>
</article>
{{ end }}
