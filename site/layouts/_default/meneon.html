{{ define "main" }}
<section class="overzicht-page" data-meneon>
  <h1 id="meneon-heading">{{ .Title }}</h1>
  {{ .Content }}

  <div id="meneon-day" hidden>
    <p class="hint" id="meneon-day-nav"></p>
    <div id="meneon-day-entries">Laden…</div>
  </div>

  <div id="meneon-browse">
    <div class="filter-bar" role="group" aria-label="Toon">
      <label class="chip"><input type="checkbox" name="show" value="heilige" checked> Heiligen</label>
      <label class="chip"><input type="checkbox" name="show" value="feest" checked> Feesten</label>
      <label class="chip"><input type="checkbox" name="show" value="vasten" checked> Vasten</label>
    </div>

    <p class="filter-bar">
      <label class="search-label" for="meneon-search">Zoeken (ook alternatieve namen)</label>
      <input type="search" id="meneon-search" class="search-input" placeholder="bijv. Ludger, Ontslapen…" autocomplete="off">
    </p>

    <div class="browse-mode" role="group" aria-label="Bladeren">
      <button type="button" class="style-btn" data-browse="maand" aria-pressed="true">Maanden</button>
      <button type="button" class="style-btn" data-browse="letter" aria-pressed="false">Alfabet</button>
    </div>

    <nav class="letter-nav" id="letter-nav" hidden aria-label="Letters"></nav>
    <nav class="month-nav" id="month-nav" aria-label="Maanden"></nav>

    <p class="hint" id="meneon-hint"></p>
    <div id="meneon-list"></div>
  </div>
</section>
{{ end }}
