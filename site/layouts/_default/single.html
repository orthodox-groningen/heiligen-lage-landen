{{ define "main" }}
<article class="page{{ if or (eq .Params.soort "heilige") (eq .Params.soort "feest") (eq .Params.soort "vasten") }} page-entry{{ end }}">
  <h1>{{ .Title }}</h1>
  {{ if or (eq .Params.soort "heilige") (eq .Params.soort "feest") (eq .Params.soort "vasten") }}
    {{ partial "infobox.html" . }}
  {{ else }}
    {{ with .Params.icoon }}
      <figure class="icon-figure">
        <img src="{{ . | relURL }}" alt="Afbeelding van {{ $.Title }}" width="240" height="240" loading="lazy">
        {{ if or $.Params.icoon_bron $.Params.icoon_licentie }}
        <figcaption>
          {{- with $.Params.icoon_bron }}{{ . }}{{ end -}}
          {{- if and $.Params.icoon_bron $.Params.icoon_licentie }} · {{ end -}}
          {{- with $.Params.icoon_licentie }}{{ . }}{{ end -}}
        </figcaption>
        {{ end }}
      </figure>
    {{ end }}
  {{ end }}
  <div class="entry-body">
    {{ .Content }}
  </div>
</article>
{{ end }}
