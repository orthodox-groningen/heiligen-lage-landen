<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} · {{ .Site.Title }}{{ end }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  {{ $css := resources.Get "css/site.css" | resources.Minify }}
  <link rel="stylesheet" href="{{ $css.RelPermalink }}">
</head>
<body>
  <a class="skip-link" href="#main">Naar inhoud</a>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="{{ "" | relURL }}">Heiligen van de Lage Landen</a>
      <nav class="nav" aria-label="Hoofdnavigatie">
        <a href="{{ "" | relURL }}">Vandaag</a>
        <a href="{{ "kalender/" | relURL }}">Kalender</a>
        <a href="{{ "heiligen/" | relURL }}">Heiligen</a>
        <a href="{{ "feesten/" | relURL }}">Feesten</a>
        <a href="{{ "agenda/" | relURL }}">Agenda</a>
      </nav>
      <div class="style-toggle" role="group" aria-label="Kalender voor vandaag">
        <button type="button" data-style="gregoriaans" class="style-btn" title="Nieuwe kalender (Gregoriaans)">Nieuw</button>
        <button type="button" data-style="juliaans" class="style-btn" title="Oude kalender (Juliaans)">Oud</button>
      </div>
    </div>
  </header>
  <main id="main" class="wrap main{{ if or .IsHome (eq .Layout "kalender") (eq .Layout "agenda") }} main-wide{{ end }}">
    {{ block "main" . }}{{ .Content }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
  <script src="{{ "js/calendar.js" | relURL }}" defer></script>
</body>
</html>
