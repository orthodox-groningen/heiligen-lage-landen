{{ define "main" }}
<section class="section-list">
  <h1>{{ .Title }}</h1>
  {{ .Content }}
  <ul class="entry-list">
    {{ range sort .Pages "Params.feestdatum" }}
      <li>
        <a href="{{ .RelPermalink }}">{{ .Title }}</a>
        {{ with .Params.feestdatum }}
          <span class="meta">{{ partial "feestdatum-kort.html" . }}</span>
        {{ end }}
      </li>
    {{ end }}
  </ul>
</section>
{{ end }}
