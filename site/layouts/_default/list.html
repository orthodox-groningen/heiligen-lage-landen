{{ define "main" }}
<section class="section-list">
  <h1>{{ .Title }}</h1>
  {{ .Content }}
  <ul class="entry-list">
    {{ range sort .Pages "Params.datum_gregoriaans" }}
      <li>
        <a href="{{ .RelPermalink }}">{{ .Title }}</a>
        {{ if .Params.datum_gregoriaans }}
          <span class="meta">{{ .Params.datum_gregoriaans }} G · {{ .Params.datum_juliaans }} J</span>
        {{ end }}
      </li>
    {{ end }}
  </ul>
</section>
{{ end }}
