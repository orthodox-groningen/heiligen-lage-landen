{{ define "main" }}
<section class="home" data-home>
  <p class="eyebrow">Orthodoxe jaarcyclus — Lage Landen</p>
  <h1 id="today-heading">Vandaag</h1>
  <p class="lede">
    De knop <strong>Nieuw</strong>/<strong>Oud</strong> bepaalt hoe we <em>vandaag</em>
    rekenen. Feestdagen zelf hebben in beide kalenders dezelfde dagnaam
    (bijv. Ontslapen = 15&nbsp;augustus).
  </p>

  <div class="today-card" id="today-card" aria-live="polite">
    <p class="today-note muted" id="today-note"></p>
    <div id="today-entries">Laden…</div>
  </div>

  <div class="home-actions">
    <a class="button" href="{{ "kalender/" | relURL }}">Jaarkalender</a>
    <a class="button button-secondary" href="{{ "agenda/" | relURL }}">Agenda abonneren</a>
  </div>

  {{ .Content }}
</section>
{{ end }}
