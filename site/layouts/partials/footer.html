<footer class="site-footer">
  <div class="wrap footer-inner">
    <p>
      <a href="{{ .Site.Params.github }}">GitHub</a>
      ·
      <a href="{{ .Site.Params.org }}">orthodox-ronl</a>
      ·
      <a href="{{ "uitleg/reactie/" | relURL }}">Reactie</a>
      ·
      <a href="{{ "beheer/" | relURL }}">Voor beheerders</a>
    </p>
    <div class="site-meta">
      {{ with .Params.git_date }}
        <p class="page-git-date">Bijgewerkt: {{ . }}</p>
      {{ end }}
      {{ if .IsHome }}
        {{ with hugo.Data.build.time }}
          <p class="build-time-stamp">Gegenereerd: {{ . }}</p>
        {{ end }}
      {{ end }}
    </div>
  </div>
</footer>
